[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curlgen-mcp"
version = "1.0.2"
description = "HTTP requests, signed code generation, GateShell/SSH execution and file transfer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xiaobinger" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "curl",
  "http",
  "signature",
  "ssh",
  "jump-host",
  "bastion",
  "code-generation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.29.0,<3",
  "paramiko>=3.4,<5",
]

[project.scripts]
curlgen-mcp = "curlgen_mcp.server:main"

[project.urls]
Homepage = "https://github.com/xiaobinger/cURL_remote"
Repository = "https://github.com/xiaobinger/cURL_remote"
Issues = "https://github.com/xiaobinger/cURL_remote/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curlgen_mcp = ["py.typed"]